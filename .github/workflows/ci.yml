name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check app/ tests/ eval/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest
  build-and-push:
    needs: [test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
    - uses: actions/checkout@v5
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Get current date
      id: date
      run: echo "date=$(date --utc +%Y%m%d.%H%M)" >> $GITHUB_OUTPUT
    - name: Get sha with 8 chars long
      id: commit_sha
      run: echo "commit_sha=${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT
    - name: Build and push image
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
      id: build-push
      with:
        push: true
        load: false
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/elifesciences/jats-ref-refinery:latest
          ghcr.io/elifesciences/jats-ref-refinery:${{ github.sha }}
          ghcr.io/elifesciences/jats-ref-refinery:main-${{ steps.commit_sha.outputs.commit_sha }}-${{ steps.date.outputs.date }}
    - name: Generate artefact attestation
      uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
      with:
        subject-name: ghcr.io/elifesciences/jats-ref-refinery
        subject-digest: ${{ steps.build-push.outputs.digest }}