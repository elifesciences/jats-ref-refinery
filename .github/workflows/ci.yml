name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check app/ tests/ eval/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest
  build-and-push:
    needs: [test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Set up QEMU
      uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
    - name: Login to GHCR
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Get current date
      id: date
      run: echo "date=$(date --utc +%Y%m%d.%H%M)" >> $GITHUB_OUTPUT
    - name: Get sha with 8 chars long
      id: commit_sha
      run: echo "commit_sha=${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT
    - name: Build and push image
      uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
      id: build-push
      with:
        push: true
        load: false
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/elifesciences/jats-ref-refinery:latest
          ghcr.io/elifesciences/jats-ref-refinery:${{ github.sha }}
          ghcr.io/elifesciences/jats-ref-refinery:main-${{ steps.commit_sha.outputs.commit_sha }}-${{ steps.date.outputs.date }}
    - name: Generate artefact attestation
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
      with:
        subject-name: ghcr.io/elifesciences/jats-ref-refinery
        subject-digest: ${{ steps.build-push.outputs.digest }}
